# Local Postgres. Roles mirror production: the owner runs migrations (BYPASSRLS, not superuser),
# the web role is subject to row-level security.
# One project name for every checkout and git worktree, so they share one database container instead of fighting over port 54329.
name: kora
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: kora_admin_dev
      POSTGRES_DB: kora
    # Every test database is built by running all migrations in one transaction; with many running at once the default lock table runs out ("out of shared memory").
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    ports: ["54329:5432"]
    volumes:
      - ./infra/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # An S3-compatible server that checks request signatures, for the object-storage test (packages/core/test/blobs-s3.test.ts).
  # Not started by default: docker compose --profile s3 up -d --wait s3
  s3:
    profiles: ["s3"]
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: kora_s3
      SCALITY_SECRET_ACCESS_KEY: kora_s3_dev_secret
      S3BACKEND: mem
      REMOTE_MANAGEMENT_DISABLE: "1"
    ports: ["54330:8000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/_/healthcheck || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
