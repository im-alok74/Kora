# Local Postgres. Roles mirror production: the owner runs migrations (BYPASSRLS, not superuser),
# the web role is subject to row-level security.
# One project name for every checkout and git worktree, so they share one database container instead of fighting over port 54329.
name: kora
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: kora_admin_dev
      POSTGRES_DB: kora
    # Every test database is built by running all migrations in one transaction; with many running at once the default lock table runs out ("out of shared memory").
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    ports: ["54329:5432"]
    volumes:
      - ./infra/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
