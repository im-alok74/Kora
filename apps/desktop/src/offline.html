<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kora</title>
<style>
  body { font: 16px/1.6 system-ui, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #14181f; }
  main { max-width: 440px; padding: 32px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #4a5565; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 10px; background: #106cd9; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #14181f; outline-offset: 2px; }
</style></head>
<body><main>
  <h1>Kora cannot connect</h1>
  <p>Check your internet connection and try again. Anything you already saved is safe.</p>
  <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
</main></body></html>
