name: security

# The attack scripts in scripts/security-tests run against a throw-away copy of the app on the runner (never against a live site), and a
# dependency audit. Pull requests, a weekly run, and by hand. Findings the staging switches cause on purpose are listed in
# scripts/security-tests/run-all.mjs; anything else fails the run.
on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_DIST_DIR: .next-e2e
      DATABASE_URL: postgres://kora_web:kora_web_dev@localhost:54329/kora
      MIGRATE_DATABASE_URL: postgres://kora_owner:kora_owner_dev@localhost:54329/kora
      OTP_HMAC_SECRET: ci-secret-ci-secret-ci-secret-123456
      APP_URL: http://localhost:3320
      OTP_PROVIDER: mock
      MESSENGER: mock
      GATEWAY: mock
      GATEWAY_WEBHOOK_SECRET: dev-only-gateway-secret-change-me-32
      CRON_SECRET: ci-cron-secret-0123456789
      # The scripts sign in with a fixed code; these two switches exist for exactly this and are refused on a live deployment.
      KORA_ALLOW_MOCKS: '1'
      DEMO_FIXED_OTP: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:up
      - run: pnpm migrate
      - run: pnpm build
      - name: Start the app
        run: |
          cd apps/web
          nohup pnpm exec next start -p 3320 > ../../app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:3320/api/me && exit 0; sleep 1; done
          cat ../../app.log; exit 1
      - name: Attack scripts
        env:
          BASE: http://localhost:3320
          PT_DATABASE_URL: postgres://kora_owner:kora_owner_dev@localhost:54329/kora
        run: node scripts/security-tests/run-all.mjs
      - name: App log
        if: failure()
        run: tail -n 80 app.log

  # Known advisories are reported, not blocking in ci.yml; here a new high one in what ships is a failed run.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: ${{ github.event_name == 'pull_request' }}
